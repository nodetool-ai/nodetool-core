[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-core"
version = "0.8.1"
description = "Nodetool Core is the core library for Nodetool, providing the necessary functionality for building and running AI workflows."
readme = "README.md"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"

dependencies = [

    # Core — worker subprocess communication
    "pydantic>=2.14.0",
    "msgpack>=1.2.3",
    "websockets>=17.2",
    # httpx 1.0 pre-releases drop AsyncClient, which the model download path uses.
    "httpx>=0.28.1,<1",
    "aiohttp>=3.14.4",
    "brotli>=1.2.0",
    "pycares>=4.11.0,<5",

    # Node execution utilities
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",  # paddlex (ocr extra) pins pyyaml==6.0.2
    "psutil>=7.2.2",
    "tqdm>=4.70.1",

    # Media processing (used by nodes via ProcessingContext)
    "pillow>=12.3.0,<13",
    # Floor stays at 2.3 because paddlex (ocr extra) caps numpy<2.4. No upper cap:
    # numpy 2.5 installs where Python and the other packs allow it.
    "numpy>=2.3.5",

    # HuggingFace integration (used by HF nodes)
    # diffusers 0.41 and mflux 0.22 both require huggingface_hub<2, so the packs
    # cannot co-install with hub 2.x. Keep core on the same range they test.
    "huggingface_hub>=1.33.0,<2",
    "hf_xet>=1.7.0",
    "hf_transfer>=0.1.9",
    "aiofiles>=25.1.0",

    # Imported by core modules (ProcessingContext audio helpers,
    # media.audio.audio_helpers, integrations.huggingface.safetensors_inspector)
    "pydub>=0.25.1",
    # pydub imports the stdlib audioop module, which Python 3.13 removed.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "safetensors>=0.8.0",
]

[project.scripts]
nodetool-pkg = "nodetool.package_tools.__main__:main"

[project.optional-dependencies]
# Document processing nodes
documents = [
    "html2text>=2025.4.15",
    "markitdown>=0.1.8",
    "PyMuPDF>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "jinja2>=3.1.6",
    "pypandoc>=1.17",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
]
# OCR nodes
ocr = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pytesseract>=0.3.13",
]
# Data visualization nodes
viz = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
# Audio processing
# Kept so existing `nodetool-core[audio]` installs still resolve. pydub is a
# base dependency now.
audio = [
    "pydub>=0.25.1",
]
# Video processing (opencv, imageio)
video = [
    "opencv-python-headless>=5.0.0.93",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "ffmpeg-python>=0.2.0",
]
# Data processing (pandas, joblib, etc.)
data = [
    "pandas>=3.0.6",
    "joblib>=1.6.0",
    "ftfy>=6.3.1",
    "networkx>=3.6.1",  # 3.7 requires Python 3.12
    "tiktoken>=0.14.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "aioresponses>=0.7.9",
    # Validates the worker's emitted bridge frames against the JS repo's
    # generated dist/bridge-frames.schema.json contract.
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "ruff==0.16.10",
    "ty>=0.0.85",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool"]
include = [
    "src/nodetool/package_metadata/*.json",
]

# Ruff configuration for linting and formatting
[tool.ruff]
# Python version
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable useful rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

# Ignore specific rules (low-value or too noisy)
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (sometimes needed)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "F401",   # imported but unused (common in __init__.py)
    "F811",   # redefined while unused
    "UP006",  # use built-in collection type annotations
    "UP035",  # deprecated typing aliases (Dict, List, etc.)
    "UP045",  # prefer `X | None` over `Optional[X]`
    "RUF002", # NBSP vs '-' nit in docstrings
    "RUF010", # explicit conversion flag in f-strings
    "SIM102", # combine nested ifs
    "SIM105", # prefer contextlib.suppress over try/except/pass
    "SIM117", # use single with statement with multiple contexts
    "ARG002", # unused method/function argument
    "ARG001", # unused function argument (API handlers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101", "F401"]  # Allow unused args, assert, and unused imports in tests
"**/__init__.py" = ["F401"]  # Allow unused imports in __init__
"**/conftest.py" = ["F401"]  # Allow unused imports in conftest
# Pydantic models need their field types importable at runtime, so TC001's
# "move into a type-checking block" would break model construction.
"src/nodetool/metadata/node_metadata.py" = ["TC001"]
"src/nodetool/package_tools/enrich.py" = ["TC001"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending
line-ending = "auto"

# Mypy configuration for type checking
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Basedpyright configuration for type checking
[tool.basedpyright]
typeCheckingMode = "basic"
exclude = [
    "tests/**",
]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnusedFunction = "none"
reportUnusedClass = "none"
reportShadowedImports = "none"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
]
