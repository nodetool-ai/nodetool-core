# Build and push the nodetool-worker Docker image to GHCR.
#
# Extracted from publish-wheel.yml so the image is not only built at release
# time. Three triggers:
#
#   push to main   → builds the checked-out commit (Dockerfile `dev` stage
#                    installs nodetool-core from the build context, since the
#                    commit is not on PyPI).
#                    Tags: :main and :main-<short-sha>
#   push v*.*.* tag → release build (Dockerfile `final` stage installs
#                    nodetool-core from PyPI). Runs in parallel with
#                    publish-wheel.yml, so it waits for the version to appear
#                    on PyPI first, mirroring docker-comfy.yml.
#                    Tags: :<version> and :latest
#   workflow_dispatch → rebuild an already-published version, or force a
#                    source build of the current ref.
#
# nodetool-huggingface always comes from PyPI; its version defaults to the
# latest release since it is versioned independently of nodetool-core. That
# lookup happens after the core-on-PyPI wait, because the two repos release in
# parallel — see the step's own comment. Both versions are recorded as image
# labels (ai.nodetool.core-version, ai.nodetool.huggingface-version).

name: Build Worker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      version:
        description: "nodetool-core version to install from PyPI (empty = build from the current ref)"
        required: false
        type: string
      hf_version:
        description: "nodetool-huggingface version to bundle (defaults to latest on PyPI)"
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve build mode, versions and tags
        id: meta
        run: |
          IMAGE=ghcr.io/nodetool-ai/nodetool-worker

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -n "$VERSION" ]; then
            # Release build: nodetool-core comes from PyPI.
            WORKER_BASE=final
            TAGS="${IMAGE}:${VERSION}
          ${IMAGE}:latest"
          else
            # Source build: nodetool-core comes from the build context.
            #
            # Name the moving tag after the ref that was actually built. This
            # branch used to hardcode ":main", so a workflow_dispatch on any
            # branch republished ":main" pointing at unmerged code, and anyone
            # pulling ":main" silently got it. On main the tags are unchanged.
            WORKER_BASE=dev
            SHORT_SHA="${GITHUB_SHA::7}"
            REF_SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')
            TAGS="${IMAGE}:${REF_SLUG}
          ${IMAGE}:${REF_SLUG}-${SHORT_SHA}"
          fi

          {
            echo "version=$VERSION"
            echo "worker-base=$WORKER_BASE"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "🏗️ Mode: $WORKER_BASE"
          echo "📋 nodetool-core: ${VERSION:-<build context>}"
          echo "🏷️ Tags:"
          echo "$TAGS"

      # Release builds install nodetool-core from PyPI, and publish-wheel.yml
      # uploads it on the same tag push — wait for it to land.
      #
      # Poll the SIMPLE index, not the JSON API. They are separate surfaces with
      # independent propagation: /pypi/<pkg>/<version>/json answered 200 for
      # 0.7.10 while /simple/ still did not list it, so this step passed and the
      # build then died on "no version of nodetool-core==0.7.10". uv installs
      # from /simple, so /simple is what has to be ready.
      - name: Wait for nodetool-core on PyPI
        if: steps.meta.outputs.version != ''
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Waiting for nodetool-core==$VERSION on the PyPI simple index..."
          for i in $(seq 1 60); do
            if curl -fsSL "https://pypi.org/simple/nodetool-core/" \
                 | grep -q "nodetool_core-${VERSION}-"; then
              echo "✅ nodetool-core==$VERSION is on the simple index"
              exit 0
            fi
            echo "  not yet listed, retrying in 30s ($i/60)"
            sleep 30
          done
          echo "❌ nodetool-core==$VERSION never appeared on the simple index"
          exit 1

      # Resolved AFTER the wait above, not with the tags. Both repos release on
      # a tag push, so the two wheel builds run in parallel: reading "latest"
      # when this job starts pins the *previous* nodetool-huggingface, and the
      # image ships without the fixes released alongside it. The core wait
      # already costs a minute or more, by which time the sibling wheel has
      # landed.
      - name: Resolve nodetool-huggingface version
        id: hf
        run: |
          HF_VERSION="${{ github.event.inputs.hf_version }}"
          if [ -z "$HF_VERSION" ]; then
            # Derive "latest" from the SIMPLE index, not /pypi/<pkg>/json. They
            # are separate surfaces with independent propagation, and the JSON
            # API lags: minutes after 0.7.9 was listed on /simple, info.version
            # still answered 0.7.8. This step picked 0.7.8, the confirmation
            # below verified 0.7.8, and the build shipped the previous wheel.
            # Sorted numerically, not lexically: 0.7.10 must beat 0.7.9.
            HF_VERSION=$(curl -fsSL https://pypi.org/simple/nodetool-huggingface/ | python3 -c "import re, sys; v = set(re.findall(r'nodetool_huggingface-([0-9][^-]*)-py3', sys.stdin.read())); sys.exit('no nodetool-huggingface wheels on the simple index') if not v else print(max(v, key=lambda s: [int(p) for p in s.split('.')]))")
          fi
          # Same two-surface problem as the wait above: whichever version was
          # chosen, the install reads /simple, so confirm it is listed there.
          for i in $(seq 1 20); do
            if curl -fsSL "https://pypi.org/simple/nodetool-huggingface/" \
                 | grep -q "nodetool_huggingface-${HF_VERSION}-"; then
              echo "hf-version=$HF_VERSION" >> $GITHUB_OUTPUT
              echo "🤗 nodetool-huggingface: $HF_VERSION"
              exit 0
            fi
            echo "  nodetool-huggingface==$HF_VERSION not yet on the simple index, retrying in 30s ($i/20)"
            sleep 30
          done
          echo "❌ nodetool-huggingface==$HF_VERSION never appeared on the simple index"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.version != '' && format('v{0}', steps.meta.outputs.version) || github.sha }}

      # nodetool-huggingface pulls in torch; reclaim runner disk first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            WORKER_BASE=${{ steps.meta.outputs.worker-base }}
            NODETOOL_VERSION=${{ steps.meta.outputs.version }}
            HF_VERSION=${{ steps.hf.outputs.hf-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ai.nodetool.core-version=${{ steps.meta.outputs.version }}
            ai.nodetool.huggingface-version=${{ steps.hf.outputs.hf-version }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
